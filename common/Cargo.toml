[package]
name = "common"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait.workspace = true
axum = { workspace = true, optional = true }
axum-prometheus = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
either.workspace = true
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
itertools.workspace = true
md-5 = { workspace = true, optional = true }
metrics-process = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
once_cell.workspace = true
parking_lot = { workspace = true, optional = true }
petgraph.workspace = true
rand.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio-util = { workspace = true, optional = true, features = ["io", "compat"] }
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing-bunyan-formatter = { workspace = true, optional = true }
tracing-log = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
whoami.workspace = true

[dependencies.tracing-subscriber]
workspace = true
optional = true
features = ["env-filter"]

[dependencies.sqlx]
workspace = true
optional = true

[dependencies.reqwest]
workspace = true
features = ["json", "stream"]

[dev-dependencies]
fake.workspace = true
proptest.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["macros"] }

[features]
default = []
sqlx = ["dep:sqlx"]
telemetry = [
    "dep:tracing-bunyan-formatter",
    "dep:tracing-subscriber",
    "dep:tracing-log"
]
metrics = [
    "telemetry",

    "dep:metrics",
    "dep:metrics-process",
    "dep:axum",
    "dep:http",
    "dep:tower",
    "dep:axum-prometheus",
]
web-server-utils = [
    "dep:axum",
    "dep:mime_guess",
    "dep:httpdate",
    "dep:tokio-util",
    "dep:http",
    "dep:tower",
    "tokio/fs",
]
playlist = [
    "dep:http",
]
subsonic = [
    "playlist",

    "dep:http",
    "dep:md-5",
]
