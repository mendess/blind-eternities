<div id="list">
  <div class="list">
    {% for card in cards %}
    <p>{{card}}</p>
    {% endfor %}
  </div>
  <div class="list list-summary">
    Total {{ cards.len() }} cards.
    <a target="_blank" href="https://scryfall.com/search?q={{query|urlencode_strict}}">
      <img src="/assets/icons/games/mtg/scryfall.ico"/>View on Scryfall
    </a>
  </div>
</div>
